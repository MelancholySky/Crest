name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs rather than mutable major-version tags:
      # this workflow holds PYPI_API_TOKEN, so an upstream retag must not be
      # able to change what executes here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install package and test dependencies
        run: pip install -e ".[png]" pytest
      - name: Run test suite
        run: python -m pytest -q
      # Exact versions, bumped deliberately: this workflow handles
      # PYPI_API_TOKEN, so what runs here must not float.
      - name: Install build tools
        run: pip install build==1.6.1 twine==7.0.0
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
