[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crest-art"
version = "0.1.0"
description = "Generative terminal-art CLI — render animated parametric patterns."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Melancholy Sky", email = "melancholysky@outlook.com" }]
keywords = ["cli", "terminal", "art", "ansi", "generative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/melancholysky/crest"
Repository = "https://github.com/melancholysky/crest.git"
Documentation = "https://github.com/melancholysky/crest/blob/main/README.md"
Changelog = "https://github.com/melancholysky/crest/blob/main/CHANGELOG.md"
Issues = "https://github.com/melancholysky/crest/issues"

[project.optional-dependencies]
# PNG export is optional; the core CLI stays dependency-free.
png = ["Pillow>=10.0"]

[project.scripts]
crest = "crest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
